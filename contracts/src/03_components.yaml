components:
  securitySchemes:
    playerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Player access token (15 min). The Next.js BFF holds it server-side; the Flutter app sends it directly.
    staffAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Back-office staff token (after password + TOTP). Audience `staff`; carries permission strings.
    terminalAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Shop terminal token (90 days, audience `terminal`). Every request is also signed with the device key (X-Device-Timestamp, X-Device-Signature).
    cashierAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cashier or shop-manager token (12 h, audience `retail_staff`), valid only from the POS device it logged in on.
    agentAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Agent portal token (15 min + refresh), audience `agent`.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    TicketNoPath:
      name: ticket_no
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TicketNo' }
      example: "R7K2-M9XP-K"
    ShopCodePath:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z]{3}-\d{3}$' }
      example: ADM-004
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `next_cursor`
      schema: { type: string }
    From:
      name: from
      in: query
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      schema: { type: string, format: date }
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema: { $ref: '#/components/schemas/Language' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated by the client per user action and reused on retry. Stored 24 h; same key + different body → 422 IDEMPOTENCY_MISMATCH.
      schema: { type: string, format: uuid }
      example: 3f0c8b8e-6a3d-4c1e-9d0f-1b2a3c4d5e6f
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: Tenant code (e.g. `demo`). Sent by the Next.js server and non-browser clients; browsers are resolved by host. Must match the host's tenant when both are present, otherwise 400.
      schema: { type: string, pattern: '^[a-z0-9-]{2,32}$' }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Client-generated request id, echoed back in the response and in problem.request_id
      schema: { type: string, maxLength: 64 }
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: ID of the activated terminal or POS device
      schema: { type: string }
    DeviceTimestamp:
      name: X-Device-Timestamp
      in: header
      required: true
      description: Unix milliseconds; rejected if more than 30 s from server time
      schema: { type: integer, format: int64 }
    DeviceSignature:
      name: X-Device-Signature
      in: header
      required: true
      description: 'Base64 ECDSA P-256 signature over `METHOD\nPATH\nTIMESTAMP\nSHA256(body)` with the non-extractable WebCrypto device key'
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request (VALIDATION_FAILED) — `X-Tenant-Id` is not a tenant code or disagrees with the host, `X-Request-Id` is over 64 characters, or `Accept-Language` is not a supported language
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "https://api.example.et/errors/validation-failed", title: X-Tenant-Id does not match host, status: 400, code: VALIDATION_FAILED, request_id: req_01J9B00 }
    Unauthorized:
      description: Missing or invalid credentials (AUTH_INVALID_CREDENTIALS, AUTH_TOKEN_EXPIRED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "https://api.example.et/errors/invalid-credentials", title: Wrong phone or password, status: 401, code: AUTH_INVALID_CREDENTIALS, request_id: req_01J9B01 }
    Forbidden:
      description: Not allowed (KYC_REQUIRED, RG_SELF_EXCLUDED, RG_COOLING_OFF, RG_LIMIT_REACHED, RETAIL_DEVICE_NOT_ALLOWED, PERMISSION_DENIED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "https://api.example.et/errors/kyc-required", title: Verify your identity first, status: 403, code: KYC_REQUIRED, request_id: req_01J9B02 }
    NotFound:
      description: Not found (NOT_FOUND, BOOKING_NOT_FOUND, RETAIL_TICKET_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "https://api.example.et/errors/not-found", title: Not found, status: 404, code: NOT_FOUND, request_id: req_01J9B03 }
    Gone:
      description: Expired (BOOKING_EXPIRED, RETAIL_SLIP_CODE_EXPIRED, RETAIL_ACTIVATION_EXPIRED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "https://api.example.et/errors/booking-expired", title: This code has expired, status: 410, code: BOOKING_EXPIRED, request_id: req_01J9B04 }
    Conflict:
      description: State conflict (REG_PHONE_TAKEN, REG_ID_TAKEN, RETAIL_SHIFT_ALREADY_OPEN, PAY_WITHDRAWAL_NOT_CANCELLABLE, …)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "https://api.example.et/errors/phone-taken", title: This phone is already registered, status: 409, code: REG_PHONE_TAKEN, request_id: req_01J9B05 }
    Locked:
      description: Too many failed attempts (AUTH_LOCKED, RETAIL_PIN_LOCKED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "https://api.example.et/errors/locked", title: Account temporarily locked, status: 423, code: AUTH_LOCKED, detail: Try again in 15 minutes., request_id: req_01J9B06 }
    Unprocessable:
      description: Validation or business-rule failure; `errors[]` lists fields
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            stake_too_low: { value: { type: "https://api.example.et/errors/stake-too-low", title: Stake is below the minimum, status: 422, code: BET_STAKE_TOO_LOW, detail: Minimum stake is 5.00 ETB., request_id: req_01J9B07, errors: [ { field: stake, code: MIN, limit: "5.00" } ] } }
            insufficient_funds: { value: { type: "https://api.example.et/errors/insufficient-funds", title: Balance too low, status: 422, code: WALLET_INSUFFICIENT_FUNDS, request_id: req_01J9B08 } }
            validation: { value: { type: "https://api.example.et/errors/validation", title: Some fields are invalid, status: 422, code: VALIDATION_FAILED, request_id: req_01J9B09, errors: [ { field: phone, code: FORMAT, message: Use +2519… or +2517… } ] } }
    TooManyRequests:
      description: Rate limited (RATE_LIMITED, AUTH_OTP_RATE_LIMITED)
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "https://api.example.et/errors/rate-limited", title: Too many requests, status: 429, code: RATE_LIMITED, request_id: req_01J9B10 }
    BadGateway:
      description: Payment provider failed (PAY_PROVIDER_ERROR)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "https://api.example.et/errors/provider-error", title: Payment provider did not respond, status: 502, code: PAY_PROVIDER_ERROR, request_id: req_01J9B11 }
    PayloadTooLarge:
      description: Upload too large (VALIDATION_FAILED with errors[].code = MAX_SIZE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "https://api.example.et/errors/validation", title: File is too large, status: 413, code: VALIDATION_FAILED, request_id: req_01J9B13, errors: [ { field: file, code: MAX_SIZE, limit: "1048576" } ] }
    Unavailable:
      description: Temporarily unavailable (REAL_MONEY_DISABLED, AUTH_OTP_UNAVAILABLE, KYC_PROVIDER_UNAVAILABLE, SERVICE_UNAVAILABLE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "https://api.example.et/errors/real-money-disabled", title: Real-money play is not available yet, status: 503, code: REAL_MONEY_DISABLED, request_id: req_01J9B12 }

  schemas:
    # ------------------------------------------------------------ primitives
    Money:
      type: string
      pattern: '^-?\d{1,12}\.\d{2}$'
      description: Decimal string, 2 decimals, ETB unless a currency says otherwise
      examples: ["100.00"]
    Odds:
      type: string
      pattern: '^\d{1,6}\.\d{2,3}$'
      examples: ["1.85"]
    Timestamp:
      type: string
      format: date-time
      examples: ["2026-10-03T14:05:22Z"]
    Currency:
      type: string
      enum: [ETB]
    Language:
      type: string
      enum: [am, en]
    Phone:
      type: string
      pattern: '^\+251[79]\d{8}$'
      examples: ["+251911234567"]
    TicketNo:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]$'
      description: Crockford base32 with a mod-32 check character; retail tickets start with R
      examples: ["K7Q2-M9XP-M"]
    NextCursor:
      type: [string, "null"]
      description: Null on the last page
    Specifiers:
      type: object
      description: Market line parameters substituted into name templates, e.g. {"total":"2.5"}
      additionalProperties: { type: string }

    ErrorCode:
      type: string
      description: Stable machine code; clients switch on it. Registry in TD-01 §4.
      enum:
        - VALIDATION_FAILED
        - NOT_FOUND
        - RATE_LIMITED
        - PERMISSION_DENIED
        - SERVICE_UNAVAILABLE
        - IDEMPOTENCY_MISMATCH
        - REAL_MONEY_DISABLED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_TOKEN_EXPIRED
        - AUTH_LOCKED
        - AUTH_OTP_INVALID
        - AUTH_OTP_EXPIRED
        - AUTH_OTP_RATE_LIMITED
        - AUTH_OTP_UNAVAILABLE
        - REG_PHONE_TAKEN
        - REG_ID_TAKEN
        - REG_UNDERAGE
        - KYC_REQUIRED
        - KYC_PROVIDER_UNAVAILABLE
        - WALLET_INSUFFICIENT_FUNDS
        - PAY_METHOD_UNAVAILABLE
        - PAY_AMOUNT_OUT_OF_RANGE
        - PAY_PROVIDER_ERROR
        - PAY_WITHDRAWAL_NOT_CANCELLABLE
        - PAY_ACTIVE_BONUS_WAGERING
        - BET_ODDS_CHANGED
        - BET_MARKET_SUSPENDED
        - BET_EVENT_STARTED
        - BET_STAKE_TOO_LOW
        - BET_STAKE_TOO_HIGH
        - BET_MAX_PAYOUT
        - BET_RELATED_SELECTIONS
        - BET_TOO_MANY_LEGS
        - BET_TOO_MANY_LINES
        - BET_LIMIT_EXCEEDED
        - BET_FREE_BET_INVALID
        - RG_LIMIT_REACHED
        - RG_SELF_EXCLUDED
        - RG_COOLING_OFF
        - BOOKING_NOT_FOUND
        - BOOKING_EXPIRED
        - PROMO_INVALID
        - PROMO_ALREADY_USED
        - RETAIL_DEVICE_NOT_ALLOWED
        - RETAIL_PIN_LOCKED
        - RETAIL_ACTIVATION_EXPIRED
        - RETAIL_SHOP_CLOSED
        - RETAIL_SHIFT_NOT_OPEN
        - RETAIL_SHIFT_ALREADY_OPEN
        - RETAIL_SLIP_CODE_EXPIRED
        - RETAIL_SLIP_CODE_CONSUMED
        - RETAIL_SHOP_CASH_LIMIT
        - RETAIL_TICKET_NOT_FOUND
        - RETAIL_TICKET_NOT_PAYABLE
        - RETAIL_TICKET_ALREADY_PAID
        - RETAIL_PAYOUT_NOT_ALLOWED_HERE
        - RETAIL_PAYOUT_ID_REQUIRED
        - RETAIL_PAYOUT_DAILY_CAP
        - RETAIL_CANCEL_WINDOW_CLOSED
        - RETAIL_CANCEL_LIMIT_REACHED
        - RETAIL_MANAGER_REQUIRED
        - APPROVAL_SELF_NOT_ALLOWED

    Problem:
      type: object
      description: RFC 7807 problem details
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string, description: 'Translated, for display only' }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ErrorCode' }
        detail: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [code]
            properties:
              field: { type: string, description: 'JSON path, e.g. legs[1].odds' }
              code: { type: string }
              message: { type: string }
              current: { type: string, description: 'Current value, e.g. new odds' }
              limit: { type: string }

    # ------------------------------------------------------------ auth / me
    OtpRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        purpose: { type: string, enum: [register, login, reset] }
    OtpChallenge:
      type: object
      required: [challenge_id, expires_in, resend_after]
      properties:
        challenge_id: { type: string }
        expires_in: { type: integer, description: Seconds }
        resend_after: { type: integer, description: Seconds }
    OtpRequired:
      type: object
      required: [otp_required, challenge_id]
      properties:
        otp_required: { type: boolean, const: true }
        challenge_id: { type: string }
        expires_in: { type: integer }
    Device:
      type: object
      required: [fingerprint, platform]
      properties:
        fingerprint: { type: string }
        platform: { type: string, enum: [android, ios, web] }
        app_version: { type: string }
    RegisterRequest:
      type: object
      required: [challenge_id, otp, full_name, date_of_birth, password, accept_terms_version, device]
      properties:
        challenge_id: { type: string }
        otp: { type: string, pattern: '^\d{6}$' }
        full_name: { type: string, minLength: 3, maxLength: 100 }
        date_of_birth: { type: string, format: date }
        national_id: { type: string, maxLength: 20 }
        password: { type: string, minLength: 8, maxLength: 128 }
        language: { $ref: '#/components/schemas/Language' }
        accept_terms_version: { type: string }
        deposit_limit:
          type: [object, "null"]
          required: [period, amount]
          properties:
            period: { type: string, enum: [day, week, month] }
            amount: { $ref: '#/components/schemas/Money' }
        promo_code: { type: [string, "null"] }
        marketing_consent: { type: boolean, default: false }
        device: { $ref: '#/components/schemas/Device' }
    LoginRequest:
      type: object
      required: [phone, password, device]
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        password: { type: string }
        device: { $ref: '#/components/schemas/Device' }
        challenge_id: { type: string, description: Only on the second call for a new device }
        otp: { type: string, pattern: '^\d{6}$' }
    PasswordResetRequest:
      type: object
      required: [challenge_id, otp, new_password]
      properties:
        challenge_id: { type: string }
        otp: { type: string, pattern: '^\d{6}$' }
        new_password: { type: string, minLength: 8, maxLength: 128 }
    Tokens:
      type: object
      required: [access_token, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
        refresh_token: { type: string }
    PlayerSummary:
      type: object
      required: [id, phone, kyc_status]
      properties:
        id: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        full_name: { type: string }
        kyc_status: { $ref: '#/components/schemas/KycStatus' }
        language: { $ref: '#/components/schemas/Language' }
    AuthResult:
      type: object
      required: [player, tokens]
      properties:
        player: { $ref: '#/components/schemas/PlayerSummary' }
        tokens: { $ref: '#/components/schemas/Tokens' }
    PlayerStatus:
      type: string
      enum: [active, suspended, self_excluded, closed]
    KycStatus:
      type: string
      enum: [unverified, pending, verified, rejected, needs_info, expired]
    Me:
      type: object
      required: [id, phone, full_name, language, status, kyc_status]
      properties:
        id: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        full_name: { type: string }
        date_of_birth: { type: string, format: date }
        language: { $ref: '#/components/schemas/Language' }
        status: { $ref: '#/components/schemas/PlayerStatus' }
        kyc_status: { $ref: '#/components/schemas/KycStatus' }
        marketing_consent: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        can_withdraw: { type: boolean }
        flags:
          type: object
          properties:
            reality_check_minutes: { type: [integer, "null"] }
            excluded_until: { type: [string, "null"], format: date-time }
    MePatch:
      type: object
      minProperties: 1
      properties:
        language: { $ref: '#/components/schemas/Language' }
        marketing_consent: { type: boolean }
    Session:
      type: object
      required: [id, platform, created_at, last_used_at, current]
      properties:
        id: { type: string }
        platform: { type: string, enum: [android, ios, web] }
        user_agent: { type: string }
        ip: { type: string, description: Truncated }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_used_at: { $ref: '#/components/schemas/Timestamp' }
        current: { type: boolean }

    # ------------------------------------------------------------ KYC
    FaydaChallenge:
      type: object
      required: [case_id, otp_sent_to, expires_in]
      properties:
        case_id: { type: string }
        otp_sent_to: { type: string }
        expires_in: { type: integer }
    KycResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [verified, pending, needs_info, rejected] }
        reason_code: { type: string, enum: [NAME_MISMATCH, DOB_MISMATCH, DOC_UNREADABLE, UNDERAGE, OTHER] }

    # ------------------------------------------------------------ wallet / payments
    Wallet:
      type: object
      required: [cash, bonus, locked, currency]
      properties:
        cash: { $ref: '#/components/schemas/Money' }
        bonus: { $ref: '#/components/schemas/Money' }
        locked: { $ref: '#/components/schemas/Money', description: Pending withdrawals }
        debt: { $ref: '#/components/schemas/Money', description: Owed after a resettlement clawback }
        currency: { $ref: '#/components/schemas/Currency' }
    WalletTxn:
      type: object
      required: [id, type, amount, balance_after, created_at]
      properties:
        id: { type: string }
        type: { type: string, enum: [deposit, withdrawal, withdrawal_released, bet, win, refund, bonus, bonus_converted, adjustment] }
        amount: { $ref: '#/components/schemas/Money', description: 'Signed, from the player''s point of view' }
        balance_after: { $ref: '#/components/schemas/Money' }
        reference:
          type: object
          properties:
            type: { type: string, enum: [payment, bet, bonus, adjustment, game_round] }
            id: { type: string }
            label: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    PaymentMethodCode:
      type: string
      enum: [telebirr, cbebirr, mpesa_et, chapa, arifpay, santimpay, mock]
    AmountRange:
      type: object
      required: [min, max]
      properties:
        min: { $ref: '#/components/schemas/Money' }
        max: { $ref: '#/components/schemas/Money' }
    PaymentMethod:
      type: object
      required: [code, name, flow, available, deposit]
      properties:
        code: { $ref: '#/components/schemas/PaymentMethodCode' }
        name: { type: string }
        flow: { type: string, enum: [app_or_web, redirect, ussd_push] }
        available: { type: boolean, description: False while the provider is down (circuit breaker) }
        deposit: { $ref: '#/components/schemas/AmountRange' }
        withdrawal:
          oneOf:
            - { $ref: '#/components/schemas/AmountRange' }
            - { type: "null" }
    PayoutAccount:
      type: object
      required: [id, provider, account_masked, verified, created_at]
      properties:
        id: { type: string }
        provider: { $ref: '#/components/schemas/PaymentMethodCode' }
        account_masked: { type: string }
        holder_name: { type: [string, "null"] }
        verified: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    PayoutAccountCreate:
      type: object
      required: [provider, account_ref]
      properties:
        provider: { $ref: '#/components/schemas/PaymentMethodCode' }
        account_ref: { type: string, description: Wallet phone or bank account number }
    NextAction:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [redirect, ussd_push, app_sdk] }
        url: { type: string, format: uri }
        message: { type: string }
        sdk_payload: { type: object, additionalProperties: true }
    DepositRequest:
      type: object
      required: [method, amount]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethodCode' }
        amount: { $ref: '#/components/schemas/Money' }
        phone: { $ref: '#/components/schemas/Phone', description: Wallet phone if different from the account phone }
        return_url: { type: string, format: uri }
    DepositStatus:
      type: string
      enum: [initiated, pending, completed, failed, expired]
    Deposit:
      type: object
      required: [id, method, amount, currency, status, created_at]
      properties:
        id: { type: string }
        method: { $ref: '#/components/schemas/PaymentMethodCode' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/DepositStatus' }
        next_action:
          oneOf:
            - { $ref: '#/components/schemas/NextAction' }
            - { type: "null" }
        failure_reason: { type: [string, "null"] }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        completed_at: { $ref: '#/components/schemas/Timestamp' }
    WithdrawalRequest:
      type: object
      required: [method, amount]
      anyOf:
        - required: [payout_account_id]
        - required: [account]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethodCode' }
        amount: { $ref: '#/components/schemas/Money' }
        payout_account_id: { type: string, description: Preferred; or send `account` }
        account: { type: string, description: 'Wallet phone or bank account, saved as a payout account' }
    WithdrawalStatus:
      type: string
      enum: [requested, review, approved, processing, paid, failed, rejected, cancelled]
    Withdrawal:
      type: object
      required: [id, method, amount, currency, status, created_at]
      properties:
        id: { type: string }
        method: { $ref: '#/components/schemas/PaymentMethodCode' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/WithdrawalStatus' }
        account_masked: { type: string }
        review_reason: { type: [string, "null"] }
        rejection_reason: { type: [string, "null"] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        paid_at: { $ref: '#/components/schemas/Timestamp' }

    # ------------------------------------------------------------ catalogue
    Dictionary:
      type: object
      required: [version, lang, sports, tournaments, market_templates]
      properties:
        version: { type: integer }
        lang: { $ref: '#/components/schemas/Language' }
        sports:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              icon: { type: string }
              sort: { type: integer }
        tournaments:
          type: array
          items:
            type: object
            required: [id, sport_id, name]
            properties:
              id: { type: string }
              sport_id: { type: string }
              country: { type: [string, "null"], description: ISO 3166 alpha-2 }
              category: { type: string }
              name: { type: string }
              sort: { type: integer }
        market_templates:
          type: array
          items:
            type: object
            required: [id, name, group, outcomes]
            properties:
              id: { type: string }
              name: { type: string, description: 'Template; substitute specifiers, e.g. "Total {total}"' }
              group: { type: string, enum: [main, goals, halves, handicap, corners, player] }
              sort: { type: integer }
              outcomes:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: string }
                    name: { type: string }
        market_groups:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code: { type: string }
              name: { type: string }
    SportCount:
      type: object
      required: [id, events_count]
      properties:
        id: { type: string }
        events_count: { type: integer }
        tournaments:
          type: array
          items:
            type: object
            required: [id, events_count]
            properties:
              id: { type: string }
              events_count: { type: integer }
    FixtureStatus:
      type: string
      enum: [not_started, live, suspended, ended, closed, cancelled, postponed, abandoned]
    MarketStatus:
      type: string
      enum: [active, suspended, deactivated, settled, cancelled]
    OutcomePrice:
      type: object
      required: [id, tpl, odds, active]
      properties:
        id: { type: string, description: 'Outcome ID used in slips, bets and bookings' }
        tpl: { type: string, description: Outcome template ID (name in the dictionary) }
        odds: { $ref: '#/components/schemas/Odds' }
        active: { type: boolean }
    Market:
      type: object
      required: [id, template_id, specifiers, status, outcomes]
      properties:
        id: { type: string }
        template_id: { type: string }
        specifiers: { $ref: '#/components/schemas/Specifiers' }
        status: { $ref: '#/components/schemas/MarketStatus' }
        outcomes: { type: array, items: { $ref: '#/components/schemas/OutcomePrice' } }
    EventSummary:
      type: object
      required: [id, sport_id, tournament_id, home, away, start_time, status, markets_count, main]
      properties:
        id: { type: string }
        sport_id: { type: string }
        tournament_id: { type: string }
        home: { type: string }
        away: { type: string }
        start_time: { $ref: '#/components/schemas/Timestamp' }
        status: { $ref: '#/components/schemas/FixtureStatus' }
        markets_count: { type: integer }
        main:
          oneOf:
            - { $ref: '#/components/schemas/Market' }
            - { type: "null" }
    EventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EventSummary' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    EventDetail:
      type: object
      required: [id, sport_id, tournament_id, home, away, start_time, status, markets_count, groups_available, markets]
      properties:
        id: { type: string }
        sport_id: { type: string }
        tournament_id: { type: string }
        home: { type: string }
        away: { type: string }
        start_time: { $ref: '#/components/schemas/Timestamp' }
        status: { $ref: '#/components/schemas/FixtureStatus' }
        markets_count: { type: integer }
        groups_available: { type: array, items: { type: string } }
        markets: { type: array, items: { $ref: '#/components/schemas/Market' } }
    SearchResult:
      type: object
      required: [tournaments, events]
      properties:
        tournaments:
          type: array
          items:
            type: object
            required: [id, sport_id, name]
            properties:
              id: { type: string }
              sport_id: { type: string }
              name: { type: string }
        events: { type: array, items: { $ref: '#/components/schemas/EventSummary' } }

    # ------------------------------------------------------------ slips and bets
    BetType:
      type: string
      enum: [single, multiple, system]
    OddsPolicy:
      type: string
      enum: [none, higher, any]
      description: none = reject any change; higher = accept better odds; any = accept all changes
    LegResult:
      type: string
      enum: [open, win, lose, void, half_win, half_lose]
    BetStatus:
      type: string
      enum: [open, won, lost, void, cashed_out, cancelled]
    LegInput:
      type: object
      required: [outcome_id, odds]
      properties:
        outcome_id: { type: string }
        odds: { $ref: '#/components/schemas/Odds', description: Odds the user saw }
    SlipQuoteRequest:
      type: object
      required: [bet_type, legs, stake]
      properties:
        bet_type: { $ref: '#/components/schemas/BetType' }
        system_sizes: { type: array, items: { type: integer, minimum: 1 }, description: 'e.g. [2] for 2/3; [2,3] for a Trixie' }
        legs: { type: array, minItems: 1, maxItems: 30, items: { $ref: '#/components/schemas/LegInput' } }
        stake: { $ref: '#/components/schemas/Money', description: Total stake }
        stake_is_per_line: { type: boolean, default: false }
    Quote:
      type: object
      required: [lines, stake_per_line, total_stake, stake_tax, net_stake, gross_payout, acca_bonus, taxes, net_payout, capped, warnings]
      properties:
        lines: { type: integer }
        stake_per_line: { $ref: '#/components/schemas/Money' }
        total_stake: { $ref: '#/components/schemas/Money' }
        stake_tax: { $ref: '#/components/schemas/Money' }
        net_stake: { $ref: '#/components/schemas/Money' }
        total_odds: { type: [string, "null"], description: 'Single-line bets only; display only, product of odds floored to 2 decimals' }
        gross_payout: { $ref: '#/components/schemas/Money' }
        acca_bonus: { $ref: '#/components/schemas/Money' }
        taxes: { type: object, additionalProperties: { $ref: '#/components/schemas/Money' }, description: 'Every tax by code, including operator-borne ones that are not deducted' }
        win_tax: { $ref: '#/components/schemas/Money', description: Sum of payout taxes deducted from the payout }
        stake_tax_refund: { $ref: '#/components/schemas/Money' }
        net_payout: { $ref: '#/components/schemas/Money' }
        capped: { type: boolean, description: Pre-tax payout was cut to max_payout }
        warnings: { type: array, items: { type: string, enum: [STAKE_REMAINDER_NOT_CHARGED, ACCA_BONUS_CAPPED, MAX_PAYOUT_REACHED] } }
        rules_version: { type: integer }
    PlaceBetRequest:
      type: object
      required: [bet_type, legs, stake]
      properties:
        bet_type: { $ref: '#/components/schemas/BetType' }
        system_sizes: { type: array, items: { type: integer, minimum: 1 } }
        legs: { type: array, minItems: 1, maxItems: 30, items: { $ref: '#/components/schemas/LegInput' } }
        stake: { $ref: '#/components/schemas/Money' }
        odds_policy: { $ref: '#/components/schemas/OddsPolicy' }
        use_bonus: { type: boolean, default: false }
        free_bet_id: { type: [string, "null"] }
        booking_code: { type: [string, "null"], description: When the slip was loaded from a booking }
    BetLeg:
      type: object
      required: [outcome_id, fixture_id, fixture_name, start_time, market_name, outcome_name, odds_taken, result]
      properties:
        outcome_id: { type: string }
        fixture_id: { type: string }
        fixture_name: { type: string }
        start_time: { $ref: '#/components/schemas/Timestamp' }
        market_name: { type: string, description: Resolved in the request language }
        outcome_name: { type: string }
        specifiers: { $ref: '#/components/schemas/Specifiers' }
        odds_taken: { $ref: '#/components/schemas/Odds' }
        result: { $ref: '#/components/schemas/LegResult' }
    Bet:
      type: object
      required: [id, ticket_id, status, bet_type, lines, stake, stake_tax, potential_payout, acca_bonus, legs, placed_at]
      properties:
        id: { type: string }
        ticket_id: { $ref: '#/components/schemas/TicketNo' }
        channel: { type: string, enum: [online, retail] }
        status: { $ref: '#/components/schemas/BetStatus' }
        bet_type: { $ref: '#/components/schemas/BetType' }
        system_sizes: { type: array, items: { type: integer } }
        lines: { type: integer }
        stake: { $ref: '#/components/schemas/Money' }
        stake_bonus: { $ref: '#/components/schemas/Money', description: Part paid from bonus balance }
        stake_tax: { $ref: '#/components/schemas/Money' }
        total_odds: { type: [string, "null"], description: 'Display only; floored to 2 decimals' }
        potential_payout: { $ref: '#/components/schemas/Money' }
        acca_bonus: { $ref: '#/components/schemas/Money' }
        payout: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: "null" } ] }
        win_tax: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: "null" } ] }
        legs: { type: array, items: { $ref: '#/components/schemas/BetLeg' } }
        placed_at: { $ref: '#/components/schemas/Timestamp' }
        settled_at: { type: [string, "null"], format: date-time }
    PlacedBet:
      allOf:
        - { $ref: '#/components/schemas/Bet' }
        - type: object
          required: [balance]
          properties:
            balance:
              type: object
              required: [cash, bonus]
              properties:
                cash: { $ref: '#/components/schemas/Money' }
                bonus: { $ref: '#/components/schemas/Money' }

    # ------------------------------------------------------------ bookings / tickets
    BookingCreate:
      type: object
      required: [bet_type, legs]
      properties:
        bet_type: { $ref: '#/components/schemas/BetType' }
        system_sizes: { type: array, items: { type: integer } }
        legs:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [outcome_id]
            properties: { outcome_id: { type: string } }
        stake: { $ref: '#/components/schemas/Money' }
        source_bet_id: { type: [string, "null"], description: When sharing a placed bet }
    BookingCreated:
      type: object
      required: [code, expires_at, share_url]
      properties:
        code: { type: string }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        share_url: { type: string, format: uri }
    PricedLeg:
      type: object
      description: A stored selection re-priced now. Used by bookings and retail slip codes.
      required: [outcome_id, available]
      properties:
        outcome_id: { type: string }
        fixture_id: { type: string }
        fixture_name: { type: string }
        start_time: { $ref: '#/components/schemas/Timestamp' }
        market_id: { type: string }
        market_name: { type: string }
        outcome_name: { type: string }
        odds: { $ref: '#/components/schemas/Odds', description: Current odds (absent when unavailable) }
        odds_at_code: { $ref: '#/components/schemas/Odds', description: Odds when the code was made }
        changed: { type: string, enum: [up, down, none] }
        available: { type: boolean }
        reason: { type: string, enum: [EVENT_STARTED, MARKET_SUSPENDED, MARKET_CLOSED, NOT_FOUND] }
    Booking:
      type: object
      required: [code, bet_type, expires_at, legs]
      properties:
        code: { type: string }
        bet_type: { $ref: '#/components/schemas/BetType' }
        system_sizes: { type: array, items: { type: integer } }
        stake_hint: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: "null" } ] }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        legs: { type: array, items: { $ref: '#/components/schemas/PricedLeg' } }
    TicketCheck:
      type: object
      required: [ticket_id, channel, status, bet_type, placed_at, stake, legs]
      properties:
        ticket_id: { $ref: '#/components/schemas/TicketNo' }
        channel: { type: string, enum: [online, retail] }
        status: { type: string, enum: [open, won, lost, void, cashed_out, cancelled, paid, expired] }
        bet_type: { $ref: '#/components/schemas/BetType' }
        placed_at: { $ref: '#/components/schemas/Timestamp' }
        settled_at: { type: [string, "null"], format: date-time }
        stake: { $ref: '#/components/schemas/Money' }
        payout: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: "null" } ] }
        legs:
          type: array
          items:
            type: object
            required: [fixture_name, market_name, outcome_name, odds, result]
            properties:
              fixture_name: { type: string }
              market_name: { type: string }
              outcome_name: { type: string }
              odds: { $ref: '#/components/schemas/Odds' }
              result: { $ref: '#/components/schemas/LegResult' }

    # ------------------------------------------------------------ promotions / RG / inbox
    Promotion:
      type: object
      required: [id, code, title, summary]
      properties:
        id: { type: string }
        code: { type: string }
        title: { type: string }
        summary: { type: string }
        terms_md: { type: string }
        image_url: { type: [string, "null"], format: uri }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        requires_code: { type: boolean }
    MyBonuses:
      type: object
      required: [active, free_bets]
      properties:
        active:
          oneOf:
            - type: object
              required: [id, amount, wagering_required, wagering_done, expires_at]
              properties:
                id: { type: string }
                title: { type: string }
                amount: { $ref: '#/components/schemas/Money' }
                wagering_required: { $ref: '#/components/schemas/Money' }
                wagering_done: { $ref: '#/components/schemas/Money' }
                expires_at: { $ref: '#/components/schemas/Timestamp' }
            - { type: "null" }
        free_bets:
          type: array
          items:
            type: object
            required: [id, stake, min_legs, expires_at]
            properties:
              id: { type: string }
              stake: { $ref: '#/components/schemas/Money' }
              min_legs: { type: integer }
              min_leg_odds: { type: [string, "null"] }
              min_total_odds: { type: [string, "null"] }
              expires_at: { $ref: '#/components/schemas/Timestamp' }
    RgLimitType:
      type: string
      enum: [deposit, stake, loss, session_minutes]
    RgPeriod:
      type: string
      enum: [day, week, month]
    RgLimit:
      type: object
      required: [type, period, effective_from]
      properties:
        type: { $ref: '#/components/schemas/RgLimitType' }
        period: { $ref: '#/components/schemas/RgPeriod' }
        amount: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: "null" } ] }
        minutes: { type: [integer, "null"] }
        effective_from: { $ref: '#/components/schemas/Timestamp' }
        used: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: "null" } ], description: Used in the current period }
        pending:
          oneOf:
            - type: object
              required: [effective_from]
              properties:
                amount: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: "null" } ] }
                minutes: { type: [integer, "null"] }
                effective_from: { $ref: '#/components/schemas/Timestamp' }
            - { type: "null" }
    RgLimitSet:
      type: object
      required: [type, period]
      properties:
        type: { $ref: '#/components/schemas/RgLimitType' }
        period: { $ref: '#/components/schemas/RgPeriod' }
        amount: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: "null" } ], description: Null removes the limit (applies after 24 h) }
        minutes: { type: [integer, "null"] }
    SelfExclusionRequest:
      type: object
      required: [kind, duration]
      properties:
        kind: { type: string, enum: [time_out, self_exclusion] }
        duration: { type: string, enum: [24h, 7d, 30d, 6m, 1y, 5y, permanent] }
    Exclusion:
      type: object
      required: [kind, starts_at, ends_at]
      properties:
        kind: { type: string, enum: [time_out, self_exclusion, operator_exclusion] }
        starts_at: { $ref: '#/components/schemas/Timestamp' }
        ends_at: { type: [string, "null"], format: date-time, description: Null = permanent }
    InboxItem:
      type: object
      required: [id, title, body, created_at]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        deep_link: { type: [string, "null"] }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    # ------------------------------------------------------------ config
    TaxRule:
      type: object
      required: [code, base, rate, deduct_from]
      properties:
        code: { type: string, enum: [STAKE_TAX, WIN_TAX, WITHHOLDING, LEVY] }
        base: { type: string, enum: [stake, gross_win, net_win, profit] }
        rate: { type: string, description: 'Decimal fraction, e.g. "0.15"' }
        threshold: { $ref: '#/components/schemas/Money', description: Applies only above this amount }
        deduct_from: { type: string, enum: [stake, payout, operator] }
    RuleSet:
      type: object
      description: Betting rule set used by the slip calculator (C07). Identical inputs must give identical outputs in Python, Dart and TypeScript.
      required: [rules_version, min_stake, max_stake, max_payout, max_legs, max_lines, acca_bonus_table, acca_bonus_min_leg_odds, acca_bonus_max, taxes, rounding, default_odds_policy]
      properties:
        rules_version: { type: integer }
        min_stake: { $ref: '#/components/schemas/Money' }
        max_stake: { $ref: '#/components/schemas/Money' }
        max_payout: { $ref: '#/components/schemas/Money' }
        max_legs: { type: integer }
        max_lines: { type: integer }
        acca_bonus_table:
          type: array
          items:
            type: object
            required: [min_legs, pct]
            properties:
              min_legs: { type: integer }
              pct: { type: string, description: 'Percent of profit, e.g. "8"' }
        acca_bonus_min_leg_odds: { $ref: '#/components/schemas/Odds' }
        acca_bonus_max: { $ref: '#/components/schemas/Money' }
        taxes: { type: array, items: { $ref: '#/components/schemas/TaxRule' } }
        refund_stake_tax_on_void: { type: boolean, default: false, description: Refund the stake tax when every leg is void }
        rounding: { type: string, enum: [down] }
        default_odds_policy: { $ref: '#/components/schemas/OddsPolicy' }
        quick_stakes: { type: array, items: { $ref: '#/components/schemas/Money' } }
    PublicConfig:
      type: object
      required: [tenant, brand, languages, default_language, currency, real_money_enabled, features, betting, dictionary_version]
      properties:
        tenant:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string }
        brand:
          type: object
          required: [name, logo_url, colors]
          properties:
            name: { type: string }
            logo_url: { type: string, format: uri }
            colors: { type: object, additionalProperties: { type: string } }
            support:
              type: object
              properties:
                telegram: { type: string }
                phone: { type: string }
        languages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        default_language: { $ref: '#/components/schemas/Language' }
        currency: { $ref: '#/components/schemas/Currency' }
        timezone: { type: string }
        real_money_enabled: { type: boolean }
        features:
          type: object
          additionalProperties: { type: boolean }
        betting: { $ref: '#/components/schemas/RuleSet' }
        retail_betting: { $ref: '#/components/schemas/RuleSet', description: Rule set used by shop terminals and the POS }
        dictionary_version: { type: integer }
        min_app_version: { type: string }
        legal:
          type: object
          properties:
            terms_version: { type: string }
            rules_url: { type: string, format: uri }
            min_age: { type: integer }
    AppVersion:
      type: object
      required: [min_supported, latest]
      properties:
        min_supported: { type: string }
        latest: { type: string }
        download_url: { type: string, format: uri }
        sha256: { type: string }
        release_notes: { type: string }
    Game:
      type: object
      required: [id, name, category, available]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        thumbnail_url: { type: string, format: uri }
        available: { type: boolean }
    CmsPage:
      type: object
      required: [slug, lang, title, body_md]
      properties:
        id: { type: string, readOnly: true }
        slug: { type: string }
        lang: { $ref: '#/components/schemas/Language' }
        title: { type: string }
        body_md: { type: string }
        version: { type: integer, readOnly: true }
        published_at: { type: [string, "null"], format: date-time }
    Banner:
      type: object
      required: [placement, image_url, lang]
      properties:
        id: { type: string, readOnly: true }
        placement: { type: string, enum: [home_top, home_middle, terminal_idle] }
        image_url: { type: string, format: uri }
        link: { type: [string, "null"] }
        lang: { $ref: '#/components/schemas/Language' }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        sort: { type: integer }

    # ------------------------------------------------------------ retail
    TerminalActivateRequest:
      type: object
      required: [activation_code, device_public_key]
      properties:
        activation_code: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{8}$' }
        device_public_key: { type: string, description: 'SPKI, base64 (ECDSA P-256)' }
        app_version: { type: string }
    TerminalActivation:
      type: object
      required: [terminal_id, shop, access_token, expires_in, rule_set]
      properties:
        terminal_id: { type: string }
        label: { type: string }
        shop:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string }
        access_token: { type: string }
        expires_in: { type: integer }
        rule_set: { type: string, enum: [retail] }
    TerminalCreated:
      type: object
      required: [id, label, status, activation_code, activation_expires_at]
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [pending] }
        activation_code: { type: string, description: Shown once }
        activation_expires_at: { $ref: '#/components/schemas/Timestamp' }
    SlipCodeCreate:
      type: object
      required: [bet_type, legs]
      properties:
        bet_type: { $ref: '#/components/schemas/BetType' }
        system_sizes: { type: array, items: { type: integer } }
        legs:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [outcome_id]
            properties:
              outcome_id: { type: string }
              odds: { $ref: '#/components/schemas/Odds', description: 'Odds shown on the terminal (for the "changed" flag later)' }
        stake_hint: { $ref: '#/components/schemas/Money' }
    SlipCodeCreated:
      type: object
      required: [code, display, expires_at, qr]
      properties:
        code: { type: string, pattern: '^\d{8}$' }
        display: { type: string, description: 'Grouped for reading, "4829 1735"' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        qr: { type: string, description: Content to encode as QR }
    SlipCode:
      type: object
      required: [code, bet_type, expires_at, consumed, legs]
      properties:
        code: { type: string }
        bet_type: { $ref: '#/components/schemas/BetType' }
        system_sizes: { type: array, items: { type: integer } }
        stake_hint: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: "null" } ] }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        consumed: { type: boolean }
        consumed_ticket_no: { type: [string, "null"] }
        legs: { type: array, items: { $ref: '#/components/schemas/PricedLeg' } }
