      operationId: activatePosDevice
      summary: Activate a cashier PC once with its one-time code; later staff logins must come from this device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TerminalActivateRequest' }
            example: { activation_code: P4ZQ8M2K, device_public_key: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...", app_version: "1.0.0" }
      responses:
        '200':
          description: Activated; the POS stores the device id and keeps the private key in IndexedDB
          content:
            application/json:
              schema:
                type: object
                required: [device_id, shop]
                properties:
                  device_id: { type: string }
                  label: { type: string }
                  shop:
                    type: object
                    required: [code, name]
                    properties:
                      code: { type: string }
                      name: { type: string }
              example: { device_id: "01J9A9C0000000000000000001", label: Counter 1, shop: { code: ADM-004, name: Adama Kebele 04 } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

