  # ================================================================ Retail: terminal (C19)
  /v1/retail/terminals/activate:
    post:
      tags: [Retail - terminal]
      operationId: activateTerminal
      summary: Activate a shop terminal once with its one-time code (5 attempts per IP per hour)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TerminalActivateRequest' }
            example: { activation_code: K7Q2M9XP, device_public_key: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...", app_version: "1.4.0" }
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerminalActivation' }
              example: { terminal_id: "01J9A900000000000000000001", label: PC 3, shop: { code: ADM-004, name: Adama Kebele 04 }, access_token: "eyJhbGciOi...", expires_in: 7776000, rule_set: retail }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/retail/terminal:
    get:
      tags: [Retail - terminal]
      operationId: getTerminalSelf
      summary: Terminal status and shop (called on boot and every 5 minutes)
      security: [ { terminalAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/DeviceTimestamp' }, { $ref: '#/components/parameters/DeviceSignature' } ]
      responses:
        '200':
          description: Terminal
          content:
            application/json:
              schema:
                type: object
                required: [terminal_id, status, shop]
                properties:
                  terminal_id: { type: string }
                  label: { type: string }
                  status: { type: string, enum: [active, revoked] }
                  shop:
                    type: object
                    required: [code, name, open_now]
                    properties:
                      code: { type: string }
                      name: { type: string }
                      open_now: { type: boolean }
                  idle_reset_seconds: { type: integer }
                  code_display_seconds: { type: integer }
              example: { terminal_id: "01J9A900000000000000000001", label: PC 3, status: active, shop: { code: ADM-004, name: Adama Kebele 04, open_now: true }, idle_reset_seconds: 90, code_display_seconds: 60 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/retail/slip-codes:
    post:
      tags: [Retail - terminal]
      operationId: createSlipCode
      summary: Turn a terminal slip into an 8-digit slip code (30 per terminal per 10 min)
      security: [ { terminalAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/DeviceTimestamp' }, { $ref: '#/components/parameters/DeviceSignature' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlipCodeCreate' }
            example: { bet_type: multiple, legs: [ { outcome_id: oc_ac_1 }, { outcome_id: oc_sg_1 } ], stake_hint: "50.00" }
      responses:
        '201':
          description: Slip code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlipCodeCreated' }
              example: { code: "48291735", display: "4829 1735", expires_at: "2026-10-04T13:00:00Z", qr: "https://example.et/r/48291735" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ================================================================ Retail: cashier POS (C19)
  /v1/retail/auth/login:
    post:
      tags: [Retail - cashier]
      operationId: staffLogin
      summary: Cashier or shop-manager login (only from an activated POS device of the same shop)
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/DeviceTimestamp' }, { $ref: '#/components/parameters/DeviceSignature' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, pin]
              properties:
                username: { type: string }
                pin: { type: string, pattern: '^\d{6}$' }
            example: { username: abebe.k, pin: "482913" }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSession' }
              examples:
                no_open_shift: { value: { access_token: "eyJhbGciOi...", expires_in: 43200, staff: { id: "01J9A910000000000000000001", full_name: Abebe Kebede, role: cashier, shop_code: ADM-004, shop_name: Adama Kebele 04 }, open_shift: null, unprinted_tickets: [] } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '423': { $ref: '#/components/responses/Locked' }

  /v1/retail/auth/logout:
    post:
      tags: [Retail - cashier]
      operationId: staffLogout
      summary: End the staff session (the shift stays open)
      security: [ { cashierAuth: [] } ]
      responses:
        '204': { description: Logged out }

  /v1/retail/shifts:
    post:
      tags: [Retail - cashier]
      operationId: openShift
      summary: Open a shift with the counted opening cash
      security: [ { cashierAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/DeviceTimestamp' }, { $ref: '#/components/parameters/DeviceSignature' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opening_cash]
              properties: { opening_cash: { $ref: '#/components/schemas/Money' } }
            example: { opening_cash: "1500.00" }
      responses:
        '201':
          description: Shift opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
              example: { $ref: '#/components/examples/ShiftJustOpenedExample/value' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/retail/shifts/current:
    get:
      tags: [Retail - cashier]
      operationId: getCurrentShift
      summary: The caller's open shift with running totals
      security: [ { cashierAuth: [] } ]
      responses:
        '200':
          description: Shift
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
              example: { $ref: '#/components/examples/ShiftOpenExample/value' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/retail/shifts/current/tickets:
    get:
      tags: [Retail - cashier]
      operationId: listShiftTickets
      summary: Tickets sold and paid in the current shift (for reprint and review)
      security: [ { cashierAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200':
          description: Page of tickets
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RetailTicketSummary' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              example:
                items:
                  - { ticket_no: "R7K2-M9XP-K", status: open, stake: "50.00", potential_win: "89.25", sold_at: "2026-10-04T09:12:40Z", event: sold, printed: true }
                next_cursor: null

  /v1/retail/shifts/{id}/cash-movements:
    post:
      tags: [Retail - cashier]
      operationId: addCashMovement
      summary: Record cash in or out of the drawer (above threshold needs a manager PIN)
      security: [ { cashierAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdPath' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashMovementCreate' }
            example: { kind: cash_out, amount: "5000.00", reason: Handed to agent }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/retail/shifts/{id}/close:
    post:
      tags: [Retail - cashier]
      operationId: closeShift
      summary: Close a shift with a count by denomination; returns the Z report
      security: [ { cashierAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdPath' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [denominations]
              properties:
                denominations:
                  type: object
                  description: Count per note or coin value in birr
                  additionalProperties: { type: integer, minimum: 0 }
            example: { denominations: { "200": 12, "100": 30, "50": 4, "10": 0, "5": 0, "1": 0 } }
      responses:
        '200':
          description: Z report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZReport' }
              example:
                shift_id: "01J9A920000000000000000001"
                cashier: Abebe Kebede
                shop_code: ADM-004
                opened_at: "2026-10-04T07:02:11Z"
                closed_at: "2026-10-04T19:05:00Z"
                opening_cash: "1500.00"
                sales: { count: 214, amount: "48250.00" }
                payouts: { count: 61, amount: "31100.00" }
                cancels: { count: 2, amount: "150.00" }
                cash_in: "5000.00"
                cash_out: "15000.00"
                expected: "8500.00"
                counted: "8500.00"
                variance: "0.00"
                z_report_pdf: "/v1/retail/shifts/01J9A920000000000000000001/z-report.pdf"

  /v1/retail/slip-codes/{code}:
    get:
      tags: [Retail - cashier]
      operationId: loadSlipCode
      summary: Load a slip code at current odds
      security: [ { cashierAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { name: code, in: path, required: true, schema: { type: string, pattern: '^\d{8}$' }, example: "48291735" }
      responses:
        '200':
          description: Slip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlipCode' }
              example:
                code: "48291735"
                bet_type: multiple
                system_sizes: []
                stake_hint: "50.00"
                expires_at: "2026-10-04T13:00:00Z"
                consumed: false
                consumed_ticket_no: null
                legs:
                  - $ref: '#/components/examples/PricedLegArsenal/value'
                  - $ref: '#/components/examples/PricedLegStartedGame/value'
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/retail/tickets:
    post:
      tags: [Retail - cashier]
      operationId: sellTicket
      summary: Sell a ticket for cash
      security: [ { cashierAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/DeviceTimestamp' }, { $ref: '#/components/parameters/DeviceSignature' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetailTicketCreate' }
            example: { slip_code: "48291735", bet_type: single, legs: [ { outcome_id: oc_ac_1, odds: "2.10" } ], stake: "50.00", age_confirmed: true }
      responses:
        '201':
          description: Ticket sold; print `receipt`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetailTicket' }
              example: { $ref: '#/components/examples/RetailTicketSoldExample/value' }
        '409':
          description: Odds changed, selection unavailable, or slip code already used
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                slip_code_consumed: { value: { type: "https://api.example.et/errors/slip-code-consumed", title: Slip code already used, status: 409, code: RETAIL_SLIP_CODE_CONSUMED, detail: "Sold as ticket R7K2-M9XP-K", request_id: req_01J9A93 } }
                odds_changed: { value: { type: "https://api.example.et/errors/odds-changed", title: Odds have changed, status: 409, code: BET_ODDS_CHANGED, detail: 1 selection changed price., request_id: req_01J9A94, errors: [ { field: "legs[0].odds", code: ODDS_CHANGED, current: "2.05" } ] } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/retail/tickets/{ticket_no}:
    get:
      tags: [Retail - cashier]
      operationId: scanTicket
      summary: Scan a ticket (barcode carries ticket number + MAC)
      security: [ { cashierAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/TicketNoPath' }
        - { name: mac, in: query, required: false, description: "10-character MAC from the barcode; required for payout, optional when typed", schema: { type: string, pattern: '^[0-9A-F]{10}$' }, example: 3F9A0C21B7 }
      responses:
        '200':
          description: Ticket status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketScan' }
              examples:
                won_payable: { value: { ticket_no: "R7K2-M9XP-K", status: won, stake: "50.00", payable: "89.25", sold_at_shop: ADM-004, sold_at: "2026-10-04T09:12:40Z", can_pay_here: true, requires_id: false, requires_approval: false, approval_status: null, claim_expires_at: "2026-11-03T16:02:00Z", paid: null, legs: [ { fixture_name: Arsenal v Chelsea, market_name: "1X2", outcome_name: "1", odds: "2.10", result: win } ] } }
                already_paid: { value: { ticket_no: "R7K2-M9XP-K", status: paid, stake: "50.00", payable: "89.25", sold_at_shop: ADM-004, sold_at: "2026-10-04T09:12:40Z", can_pay_here: false, requires_id: false, requires_approval: false, approval_status: null, claim_expires_at: "2026-11-03T16:02:00Z", paid: { at: "2026-10-04T17:05:00Z", shop_code: ADM-004, by: abebe.k }, legs: [] } }
                open: { value: { ticket_no: "R7K2-M9XQ-H", status: open, stake: "20.00", payable: null, sold_at_shop: ADM-004, sold_at: "2026-10-04T11:00:00Z", can_pay_here: false, requires_id: false, requires_approval: false, approval_status: null, claim_expires_at: null, paid: null, legs: [ { fixture_name: Real Madrid v Barcelona, market_name: "Total 2.5", outcome_name: "Over 2.5", odds: "1.62", result: open } ] } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/retail/tickets/{ticket_no}/payout:
    post:
      tags: [Retail - cashier]
      operationId: payTicket
      summary: Pay a won or void ticket (exactly once)
      security: [ { cashierAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/TicketNoPath' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/DeviceTimestamp' }, { $ref: '#/components/parameters/DeviceSignature' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutRequest' }
            example: { mac: 3F9A0C21B7, id_type: null, id_number: null, deferred: false }
      responses:
        '200':
          description: Paid, or waiting for head-office approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutResult' }
              examples:
                paid: { value: { status: paid, paid: "89.25", approval_id: null, shift_expected_cash: "1460.75" } }
                approval_pending: { value: { status: approval_pending, paid: "0.00", approval_id: "01J9A950000000000000000001", shift_expected_cash: "1550.00" } }
        '409':
          description: Already paid, or not payable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: "https://api.example.et/errors/ticket-already-paid", title: Ticket already paid, status: 409, code: RETAIL_TICKET_ALREADY_PAID, detail: "Paid at ADM-004 on 2026-10-04 17:05 by abebe.k", request_id: req_01J9A96 }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/retail/tickets/{ticket_no}/cancel:
    post:
      tags: [Retail - cashier]
      operationId: cancelTicket
      summary: Cancel within the window and refund the stake in cash
      security: [ { cashierAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/TicketNoPath' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 200 }
                manager_pin: { type: string, pattern: '^\d{6}$', description: 'Needed after the cashier window, within 30 minutes' }
            example: { reason: Customer changed mind }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required: [status, refunded, shift_expected_cash]
                properties:
                  status: { type: string, const: cancelled }
                  refunded: { $ref: '#/components/schemas/Money' }
                  shift_expected_cash: { $ref: '#/components/schemas/Money' }
              example: { status: cancelled, refunded: "50.00", shift_expected_cash: "1500.00" }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/retail/tickets/{ticket_no}/reprint:
    post:
      tags: [Retail - cashier]
      operationId: reprintTicket
      summary: Reprint a receipt (marked COPY and logged)
      security: [ { cashierAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/TicketNoPath' } ]
      responses:
        '200':
          description: Receipt to print
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/retail/tickets/{ticket_no}/receipt.pdf:
    get:
      tags: [Retail - cashier]
      operationId: getReceiptPdf
      summary: Receipt as PDF (back-office reprints)
      security: [ { cashierAuth: [] }, { staffAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/TicketNoPath' } ]
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /v1/retail/settlements/pending:
    get:
      tags: [Retail - cashier]
      operationId: listPendingShopSettlements
      summary: Cash collections recorded by the agent, waiting for the shop manager to confirm
      security: [ { cashierAuth: [] } ]
      responses:
        '200':
          description: Pending settlements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CashSettlement' } }
              example:
                items:
                  - { id: "01J9A970000000000000000001", from: { kind: shop, code: ADM-004 }, to: { kind: agent, name: Adama agent }, amount: "15000.00", method: cash, reference: null, status: recorded, recorded_at: "2026-10-04T18:30:00Z" }

  /v1/retail/settlements/{id}/confirm:
    post:
      tags: [Retail - cashier]
      operationId: confirmShopSettlement
      summary: Shop manager confirms (or disputes) a cash collection
      security: [ { cashierAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdPath' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [confirm, dispute] }
                note: { type: string }
            example: { decision: confirm }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashSettlement' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ================================================================ Agent portal (C19)
  /v1/agent/auth/login:
    post:
      tags: [Agent portal]
      operationId: agentLogin
      summary: Agent login step 1 (phone + password); an OTP is sent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                password: { type: string }
            example: { phone: "+251922000111", password: "agent passphrase" }
      responses:
        '202':
          description: OTP sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequired' }
              example: { otp_required: true, challenge_id: "01J9A980000000000000000001", expires_in: 300 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/agent/auth/verify:
    post:
      tags: [Agent portal]
      operationId: agentVerifyOtp
      summary: Agent login step 2 (OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, otp]
              properties:
                challenge_id: { type: string }
                otp: { type: string, pattern: '^\d{6}$' }
            example: { challenge_id: "01J9A980000000000000000001", otp: "731904" }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                required: [agent, tokens]
                properties:
                  agent:
                    type: object
                    required: [id, name, level]
                    properties:
                      id: { type: string }
                      name: { type: string }
                      level: { type: string, enum: [master_agent, agent] }
                  tokens: { $ref: '#/components/schemas/Tokens' }
              example: { agent: { id: "01J9A990000000000000000001", name: Adama agent, level: agent }, tokens: { access_token: "eyJhbGciOi...", expires_in: 900, refresh_token: "rt_agent_1" } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/agent/shops:
    get:
      tags: [Agent portal]
      operationId: agentListShops
      summary: Shops in the caller's subtree with today's figures
      security: [ { agentAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200':
          description: Shops
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AgentShopSummary' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              example:
                items:
                  - { shop_code: ADM-004, name: Adama Kebele 04, city: Adama, status: active, today: { turnover: "48250.00", payouts: "31100.00", cancels: "150.00", ggr: "17000.00", cash_held: "17000.00", open_shifts: 1 }, max_cash_held: "50000.00" }
                  - { shop_code: ADM-007, name: Adama Bus Station, city: Adama, status: active, today: { turnover: "22010.00", payouts: "25500.00", cancels: "0.00", ggr: "-3490.00", cash_held: "-3490.00", open_shifts: 1 }, max_cash_held: "30000.00" }
                next_cursor: null

  /v1/agent/shops/{code}:
    get:
      tags: [Agent portal]
      operationId: agentGetShop
      summary: One shop with staff, terminals and recent shifts
      security: [ { agentAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/ShopCodePath' } ]
      responses:
        '200':
          description: Shop
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentShopDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agent/shops/{code}/staff:
    post:
      tags: [Agent portal]
      operationId: agentAddStaff
      summary: Add a cashier or shop manager to one of the agent's shops
      security: [ { agentAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/ShopCodePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetailStaffCreate' }
            example: { full_name: Meron Tesfaye, phone: "+251933000222", role: cashier }
      responses:
        '201':
