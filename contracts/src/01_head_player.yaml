  # ---------------------------------------------------------------- Slips (C07)
  /v1/slips/quote:
    post:
      tags: [Slips]
      operationId: quoteSlip
      security: [ {}, { playerAuth: [] }, { terminalAuth: [] } ]
      summary: Server-side slip calculation (the client computes the same numbers locally)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlipQuoteRequest' }
            example:
              bet_type: multiple
              legs:
                - { outcome_id: oc_a1, odds: "1.50" }
                - { outcome_id: oc_a2, odds: "1.50" }
                - { outcome_id: oc_a3, odds: "1.50" }
                - { outcome_id: oc_a4, odds: "1.50" }
                - { outcome_id: oc_a5, odds: "1.50" }
              stake: "100.00"
      responses:
        '200':
          description: Quote (worked example from C07)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
              example: { lines: 1, stake_per_line: "100.00", total_stake: "100.00", stake_tax: "15.00", net_stake: "85.00", total_odds: "7.59", gross_payout: "645.46", acca_bonus: "44.83", taxes: { STAKE_TAX: "15.00" }, win_tax: "0.00", stake_tax_refund: "0.00", net_payout: "690.29", capped: false, warnings: [], rules_version: 7 }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ---------------------------------------------------------------- Bets (C08)
  /v1/bets:
    post:
      tags: [Bets]
      operationId: placeBet
      summary: Place a bet
      security: [ { playerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceBetRequest' }
            example:
              bet_type: multiple
              legs:
                - { outcome_id: oc_ac_1, odds: "2.10" }
                - { outcome_id: oc_rb_o25, odds: "1.62" }
              stake: "100.00"
              odds_policy: higher
              use_bonus: false
              free_bet_id: null
      responses:
        '201':
          description: Bet accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacedBet' }
              example:
                $ref: '#/components/examples/PlacedBetExample/value'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Odds changed or selection unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                odds_changed:
                  value:
                    type: "https://api.example.et/errors/odds-changed"
                    title: Odds have changed
                    status: 409
                    code: BET_ODDS_CHANGED
                    detail: 1 selection changed price.
                    request_id: req_01J9A7Z
                    errors: [ { field: "legs[1].odds", code: ODDS_CHANGED, current: "1.55" } ]
                event_started:
                  value:
                    type: "https://api.example.et/errors/event-started"
                    title: Event has started
                    status: 409
                    code: BET_EVENT_STARTED
                    detail: A selection is no longer available.
                    request_id: req_01J9A80
                    errors: [ { field: "legs[0].outcome_id", code: EVENT_STARTED } ]
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [Bets]
      operationId: listMyBets
      summary: My bets
      security: [ { playerAuth: [] } ]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, settled] }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Page of bets
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Bet' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              example:
                items:
                  - $ref: '#/components/examples/BetOpenExample/value'
                  - $ref: '#/components/examples/BetWonExample/value'
                next_cursor: null

  /v1/bets/{id}:
