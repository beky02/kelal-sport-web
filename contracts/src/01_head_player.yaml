openapi: 3.1.0
info:
  title: Sportsbook Platform API
  version: 0.1.0
  summary: Contract for the player, retail, agent and back-office clients.
  description: |
    Contract-first API for the Ethiopian sportsbook platform (Release 1: pre-match, online and retail).
    This file is the source of truth: the FastAPI backend must conform to it, and the Next.js and Flutter
    clients generate their API types from it. CI diffs the backend's generated schema against this file
    (oasdiff) and fails on any breaking difference.

    Conventions (TD-01):
    - Money is a decimal string with 2 decimals plus a `currency` where relevant ("100.00"). Never floats.
    - Odds are decimal strings with 2-3 decimals ("1.85").
    - Times are ISO 8601 UTC with `Z`.
    - Catalogue IDs (`fx_`, `mk_`, `oc_`, `t_`, `s_`, `m_`, `o_`) and entity IDs are opaque strings.
    - Lists are cursor-paginated: `?limit=&cursor=` and a `next_cursor` (null at the end).
    - Errors are RFC 7807 `application/problem+json`; clients switch on `code`, never on `title`/`detail`.
    - `Idempotency-Key` is required on every request that moves money or creates a bet or ticket.
    - The tenant is resolved from the host; non-browser clients may send `X-Tenant-Id`.
    - `Accept-Language: am | en` selects translated names.

    Mocking: run `npx @stoplight/prism-cli mock contracts/openapi.yaml`. Every response has named
    examples; ask for a specific one with `Prefer: example=<name>` or a status with `Prefer: code=409`.
servers:
  - url: http://localhost:4010
    description: Prism mock server
  - url: http://localhost:8000
    description: Local FastAPI backend
tags:
  - name: Auth
  - name: Me
  - name: KYC
  - name: Wallet
  - name: Payments
  - name: Catalogue
  - name: Slips
  - name: Bets
  - name: Bookings
  - name: Promotions
  - name: Responsible gambling
  - name: Inbox
  - name: Config
  - name: Games (R2)
  - name: Retail - terminal
  - name: Retail - cashier
  - name: Agent portal
  - name: Admin
  - name: Admin - retail

paths:
  # ---------------------------------------------------------------- Auth (C01)
  /v1/auth/otp:
    post:
      tags: [Auth]
      operationId: sendOtp
      summary: Send a one-time code to a phone
      description: Same response whether or not the phone is registered, except purpose `register`, which returns REG_PHONE_TAKEN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
            example: { phone: "+251911234567", purpose: register }
      responses:
        '202':
          description: Code sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
              example: { challenge_id: "01J9A7QK3M8X2B7Y4Z5N6P0R1S", expires_in: 300, resend_after: 60 }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a player account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              challenge_id: "01J9A7QK3M8X2B7Y4Z5N6P0R1S"
              otp: "482913"
              full_name: Abebe Kebede
              date_of_birth: "1998-04-12"
              national_id: "1234 5678 9012"
              password: "correct horse battery"
              language: am
              accept_terms_version: "2026-10"
              deposit_limit: { period: week, amount: "1000.00" }
              promo_code: WELCOME
              device: { fingerprint: fp_8c1d2e, platform: web, app_version: "1.0.0" }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
              example:
                player: { id: "01J9A7R0000000000000000001", phone: "+251911234567", full_name: Abebe Kebede, kyc_status: unverified, language: am }
                tokens: { access_token: "eyJhbGciOi...", expires_in: 900, refresh_token: "rt_2b7Y4Z5N6P0R1S" }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with phone and password
      description: If the device is new and `auth.new_device_otp` is on, returns 202 with a challenge; repeat the call with `challenge_id` and `otp`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { phone: "+251911234567", password: "correct horse battery", device: { fingerprint: fp_8c1d2e, platform: web, app_version: "1.0.0" } }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
              example:
                player: { id: "01J9A7R0000000000000000001", phone: "+251911234567", full_name: Abebe Kebede, kyc_status: verified, language: am }
                tokens: { access_token: "eyJhbGciOi...", expires_in: 900, refresh_token: "rt_2b7Y4Z5N6P0R1S" }
        '202':
          description: New device, OTP required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequired' }
              example: { otp_required: true, challenge_id: "01J9A7QK3M8X2B7Y4Z5N6P0R1T", expires_in: 300 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { $ref: '#/components/responses/Locked' }

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Rotate tokens (the old refresh token becomes invalid)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties: { refresh_token: { type: string } }
            example: { refresh_token: "rt_2b7Y4Z5N6P0R1S" }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
              example: { access_token: "eyJhbGciOi...", expires_in: 900, refresh_token: "rt_9Q2W3E4R5T6Y" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      security: [ { playerAuth: [] } ]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password after an OTP with purpose `reset`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
            example: { challenge_id: "01J9A7QK3M8X2B7Y4Z5N6P0R1U", otp: "551203", new_password: "another long passphrase" }
      responses:
        '204': { description: Password changed; all sessions revoked }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ---------------------------------------------------------------- Me (C01)
  /v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Current player profile
      security: [ { playerAuth: [] } ]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                id: "01J9A7R0000000000000000001"
                phone: "+251911234567"
                full_name: Abebe Kebede
                date_of_birth: "1998-04-12"
                language: am
                status: active
                kyc_status: verified
                marketing_consent: false
                created_at: "2026-10-01T08:15:00Z"
                can_withdraw: true
                flags: { reality_check_minutes: 60 }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Change language or marketing consent
      security: [ { playerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MePatch' }
            example: { language: en }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/sessions:
    get:
      tags: [Me]
      operationId: listSessions
      summary: Active sessions (devices)
      security: [ { playerAuth: [] } ]
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Session' } }
              example:
                items:
                  - { id: "01J9A7S0000000000000000001", platform: web, user_agent: "Chrome 129 on Windows", ip: "196.188.x.x", created_at: "2026-10-01T08:15:00Z", last_used_at: "2026-10-03T12:00:00Z", current: true }
                  - { id: "01J9A7S0000000000000000002", platform: android, user_agent: "App 1.0.3", ip: "196.189.x.x", created_at: "2026-09-28T19:02:00Z", last_used_at: "2026-10-02T20:41:00Z", current: false }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/sessions/{id}:
    delete:
      tags: [Me]
      operationId: revokeSession
      summary: Log out a device
      security: [ { playerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- KYC (C02)
  /v1/kyc/fayda/otp:
    post:
      tags: [KYC]
      operationId: startFayda
      summary: Start Fayda (national ID) verification
      security: [ { playerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fayda_number]
              properties: { fayda_number: { type: string, minLength: 12, maxLength: 16 } }
            example: { fayda_number: "FIN1234567890" }
      responses:
        '202':
          description: OTP sent by Fayda to the phone registered with the ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaydaChallenge' }
              example: { case_id: "01J9A7T0000000000000000001", otp_sent_to: "+2519••••567", expires_in: 300 }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/kyc/fayda/verify:
    post:
      tags: [KYC]
      operationId: verifyFayda
      summary: Complete Fayda verification with the OTP
      security: [ { playerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [case_id, otp]
              properties:
                case_id: { type: string }
                otp: { type: string, pattern: '^\d{6}$' }
            example: { case_id: "01J9A7T0000000000000000001", otp: "123456" }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycResult' }
              examples:
                verified: { value: { status: verified } }
                needs_info: { value: { status: needs_info, reason_code: NAME_MISMATCH } }
                pending: { value: { status: pending } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/kyc/documents:
    post:
      tags: [KYC]
      operationId: uploadKycDocument
      summary: Upload an ID image for manual review
      security: [ { playerAuth: [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                case_id: { type: string, description: Omit to open a new manual case }
                kind: { type: string, enum: [id_front, id_back, selfie, other] }
                file: { type: string, format: binary, description: "JPEG/PNG/PDF, under 1 MB (client compresses)" }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [document_id, case_id, case_status]
                properties:
                  document_id: { type: string }
                  case_id: { type: string }
                  case_status: { $ref: '#/components/schemas/KycStatus' }
              example: { document_id: "01J9A7T1000000000000000001", case_id: "01J9A7T0000000000000000002", case_status: pending }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  # ---------------------------------------------------------------- Wallet (C03)
  /v1/wallet:
    get:
      tags: [Wallet]
      operationId: getWallet
      summary: Balances (never cached)
      security: [ { playerAuth: [] } ]
      responses:
        '200':
          description: Balances
          headers: { Cache-Control: { schema: { type: string, example: no-store } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
              example: { cash: "1208.95", bonus: "50.00", locked: "0.00", debt: "0.00", currency: ETB }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/wallet/transactions:
    get:
      tags: [Wallet]
      operationId: listWalletTransactions
      summary: Wallet history
      security: [ { playerAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - name: type
          in: query
          schema: { type: string, enum: [deposit, withdrawal, withdrawal_released, bet, win, refund, bonus, bonus_converted, adjustment] }
      responses:
        '200':
          description: Page of transactions
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WalletTxn' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              example:
                items:
                  - { id: "01J9A7U0000000000000000003", type: win, amount: "289.17", balance_after: "1208.95", reference: { type: bet, id: "01J9A7V0000000000000000001", label: "K7Q2-M9XP-M" }, created_at: "2026-10-04T21:02:00Z" }
                  - { id: "01J9A7U0000000000000000002", type: bet, amount: "-100.00", balance_after: "919.78", reference: { type: bet, id: "01J9A7V0000000000000000001", label: "K7Q2-M9XP-M" }, created_at: "2026-10-03T14:05:22Z" }
                  - { id: "01J9A7U0000000000000000001", type: deposit, amount: "500.00", balance_after: "1019.78", reference: { type: payment, id: "01J9A7W0000000000000000001", label: telebirr }, created_at: "2026-10-03T13:58:10Z" }
                next_cursor: null

  # ---------------------------------------------------------------- Payments (C04)
  /v1/payment-methods:
    get:
      tags: [Payments]
      operationId: listPaymentMethods
      summary: Methods and limits for this player
      security: [ { playerAuth: [] } ]
      responses:
        '200':
          description: Methods
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PaymentMethod' } }
              example:
                items:
                  - { code: telebirr, name: telebirr, flow: app_or_web, available: true, deposit: { min: "20.00", max: "100000.00" }, withdrawal: { min: "50.00", max: "50000.00" } }
                  - { code: cbebirr, name: CBE Birr, flow: ussd_push, available: true, deposit: { min: "20.00", max: "100000.00" }, withdrawal: { min: "50.00", max: "50000.00" } }
                  - { code: chapa, name: "Bank card / bank (Chapa)", flow: redirect, available: false, deposit: { min: "50.00", max: "100000.00" }, withdrawal: null }

  /v1/me/payout-accounts:
    get:
      tags: [Payments]
      operationId: listPayoutAccounts
      summary: Saved withdrawal accounts
      security: [ { playerAuth: [] } ]
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PayoutAccount' } }
              example:
                items:
                  - { id: "01J9A7X0000000000000000001", provider: telebirr, account_masked: "+2519••••567", holder_name: Abebe Kebede, verified: true, created_at: "2026-10-01T09:00:00Z" }
    post:
      tags: [Payments]
      operationId: addPayoutAccount
      summary: Add a withdrawal account (triggers AML rule NEW_PAYOUT_ACCOUNT)
      security: [ { playerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutAccountCreate' }
            example: { provider: telebirr, account_ref: "+251911234567" }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutAccount' }
              example: { id: "01J9A7X0000000000000000002", provider: telebirr, account_masked: "+2519••••567", holder_name: null, verified: false, created_at: "2026-10-03T10:00:00Z" }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/me/payout-accounts/{id}:
    delete:
      tags: [Payments]
      operationId: deletePayoutAccount
      summary: Remove a withdrawal account
      security: [ { playerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/deposits:
    post:
      tags: [Payments]
      operationId: createDeposit
      summary: Start a deposit
      security: [ { playerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositRequest' }
            example: { method: chapa, amount: "500.00", return_url: "https://example.et/wallet" }
      responses:
        '201':
          description: Deposit started; follow next_action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deposit' }
              examples:
                redirect:
                  value: { id: "01J9A7W0000000000000000002", method: chapa, amount: "500.00", currency: ETB, status: pending, next_action: { type: redirect, url: "https://checkout.chapa.co/checkout/payment/abc123" }, expires_at: "2026-10-03T14:13:10Z", created_at: "2026-10-03T13:58:10Z" }
                ussd_push:
                  value: { id: "01J9A7W0000000000000000003", method: cbebirr, amount: "500.00", currency: ETB, status: pending, next_action: { type: ussd_push, message: "Approve the payment on your phone" }, expires_at: "2026-10-03T14:13:10Z", created_at: "2026-10-03T13:58:10Z" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/deposits/{id}:
    get:
      tags: [Payments]
      operationId: getDeposit
      summary: Deposit status (poll every 3 s while pending)
      security: [ { playerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '200':
          description: Deposit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deposit' }
              examples:
                completed: { value: { id: "01J9A7W0000000000000000002", method: telebirr, amount: "500.00", currency: ETB, status: completed, next_action: null, expires_at: "2026-10-03T14:13:10Z", created_at: "2026-10-03T13:58:10Z", completed_at: "2026-10-03T13:58:41Z" } }
                pending: { value: { id: "01J9A7W0000000000000000002", method: telebirr, amount: "500.00", currency: ETB, status: pending, next_action: { type: redirect, url: "https://app.ethiotelecom.et/pay/abc" }, expires_at: "2026-10-03T14:13:10Z", created_at: "2026-10-03T13:58:10Z" } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/withdrawals:
    post:
      tags: [Payments]
      operationId: createWithdrawal
      summary: Request a withdrawal
      security: [ { playerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawalRequest' }
            example: { method: telebirr, amount: "2000.00", payout_account_id: "01J9A7X0000000000000000001" }
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
              examples:
                processing: { value: { id: "01J9A7Y0000000000000000001", method: telebirr, amount: "2000.00", currency: ETB, status: processing, account_masked: "+2519••••567", review_reason: null, created_at: "2026-10-04T09:00:00Z" } }
                review: { value: { id: "01J9A7Y0000000000000000002", method: telebirr, amount: "20000.00", currency: ETB, status: review, account_masked: "+2519••••567", review_reason: FIRST_WITHDRAWAL, created_at: "2026-10-04T09:00:00Z" } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/withdrawals/{id}:
    get:
      tags: [Payments]
      operationId: getWithdrawal
      summary: Withdrawal status
      security: [ { playerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '200':
          description: Withdrawal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
              example: { id: "01J9A7Y0000000000000000001", method: telebirr, amount: "2000.00", currency: ETB, status: paid, account_masked: "+2519••••567", review_reason: null, created_at: "2026-10-04T09:00:00Z", paid_at: "2026-10-04T09:04:12Z" }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Payments]
      operationId: cancelWithdrawal
      summary: Cancel while requested or in review
      security: [ { playerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '200':
          description: Cancelled; money back in cash balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Catalogue (C06)
  /v1/dictionary:
    get:
      tags: [Catalogue]
      operationId: getDictionary
      security: [ {}, { playerAuth: [] }, { terminalAuth: [] } ]
      summary: Versioned reference data (sports, tournaments, market and outcome name templates)
      description: Clients store it and send `version`; 304 when unchanged. Names are in the `Accept-Language` language.
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - name: version
          in: query
          description: Version the client already holds
          schema: { type: integer }
      responses:
        '200':
          description: Dictionary
          headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string, example: "public, max-age=300" } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dictionary' }
              example:
                version: 42
                lang: en
                sports:
                  - { id: s_football, name: Football, icon: football, sort: 1 }
                  - { id: s_basketball, name: Basketball, icon: basketball, sort: 2 }
                tournaments:
                  - { id: t_eth_pl, sport_id: s_football, country: ET, category: Ethiopia, name: Ethiopian Premier League, sort: 1 }
                  - { id: t_epl, sport_id: s_football, country: GB, category: England, name: Premier League, sort: 2 }
                  - { id: t_laliga, sport_id: s_football, country: ES, category: Spain, name: LaLiga, sort: 3 }
                  - { id: t_nba, sport_id: s_basketball, country: US, category: USA, name: NBA, sort: 1 }
                market_templates:
                  - { id: m_1x2, name: "1X2", group: main, sort: 1, outcomes: [ { id: o_1, name: "1" }, { id: o_x, name: "X" }, { id: o_2, name: "2" } ] }
                  - { id: m_dc, name: Double chance, group: main, sort: 2, outcomes: [ { id: o_1x, name: "1X" }, { id: o_12, name: "12" }, { id: o_x2, name: "X2" } ] }
                  - { id: m_total, name: "Total {total}", group: goals, sort: 10, outcomes: [ { id: o_over, name: "Over {total}" }, { id: o_under, name: "Under {total}" } ] }
                  - { id: m_btts, name: Both teams to score, group: goals, sort: 11, outcomes: [ { id: o_yes, name: "Yes" }, { id: o_no, name: "No" } ] }
                  - { id: m_hcp, name: "Handicap {hcp}", group: handicap, sort: 20, outcomes: [ { id: o_h1, name: "1 ({+hcp})" }, { id: o_h2, name: "2 ({-hcp})" } ] }
                  - { id: m_ml, name: Winner (incl. overtime), group: main, sort: 1, outcomes: [ { id: o_home, name: "1" }, { id: o_away, name: "2" } ] }
                market_groups:
                  - { code: main, name: Main }
                  - { code: goals, name: Goals }
                  - { code: halves, name: Halves }
                  - { code: handicap, name: Handicap }
                  - { code: corners, name: Corners }
                  - { code: player, name: Players }
        '304': { description: Client version is current }

  /v1/sports:
    get:
      tags: [Catalogue]
      operationId: listSports
      security: [ {}, { playerAuth: [] }, { terminalAuth: [] } ]
      summary: Sports with upcoming fixture counts, and their tournaments
      parameters: [ { $ref: '#/components/parameters/AcceptLanguage' } ]
      responses:
        '200':
          description: Sports
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SportCount' } }
              example:
                items:
                  - { id: s_football, events_count: 412, tournaments: [ { id: t_eth_pl, events_count: 8 }, { id: t_epl, events_count: 10 }, { id: t_laliga, events_count: 10 } ] }
                  - { id: s_basketball, events_count: 57, tournaments: [ { id: t_nba, events_count: 12 } ] }

  /v1/events:
    get:
      tags: [Catalogue]
      operationId: listEvents
      security: [ {}, { playerAuth: [] }, { terminalAuth: [] } ]
      summary: Paged pre-match fixtures with their main market
      description: Names of sports, tournaments, markets and outcomes come from the dictionary. Each outcome carries its real outcome ID so it can go straight into the bet slip.
