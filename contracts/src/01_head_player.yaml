      responses:
        '200':
          description: Fixture detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
              example:
                id: fx_arsenal_chelsea
                sport_id: s_football
                tournament_id: t_epl
                home: Arsenal
                away: Chelsea
                start_time: "2026-10-04T14:00:00Z"
                status: not_started
                markets_count: 184
                groups_available: [main, goals, halves, handicap, corners]
                markets:
                  - { id: mk_ac_1x2, template_id: m_1x2, specifiers: {}, status: active, outcomes: [ { id: oc_ac_1, tpl: o_1, odds: "2.10", active: true }, { id: oc_ac_x, tpl: o_x, odds: "3.40", active: true }, { id: oc_ac_2, tpl: o_2, odds: "3.30", active: true } ] }
                  - { id: mk_ac_dc, template_id: m_dc, specifiers: {}, status: active, outcomes: [ { id: oc_ac_1x, tpl: o_1x, odds: "1.33", active: true }, { id: oc_ac_12, tpl: o_12, odds: "1.30", active: true }, { id: oc_ac_x2, tpl: o_x2, odds: "1.66", active: true } ] }
                  - { id: mk_ac_t25, template_id: m_total, specifiers: { total: "2.5" }, status: active, outcomes: [ { id: oc_ac_o25, tpl: o_over, odds: "1.85", active: true }, { id: oc_ac_u25, tpl: o_under, odds: "1.95", active: true } ] }
                  - { id: mk_ac_t35, template_id: m_total, specifiers: { total: "3.5" }, status: suspended, outcomes: [ { id: oc_ac_o35, tpl: o_over, odds: "3.10", active: false }, { id: oc_ac_u35, tpl: o_under, odds: "1.36", active: false } ] }
                  - { id: mk_ac_btts, template_id: m_btts, specifiers: {}, status: active, outcomes: [ { id: oc_ac_by, tpl: o_yes, odds: "1.72", active: true }, { id: oc_ac_bn, tpl: o_no, odds: "2.05", active: true } ] }
        '404': { $ref: '#/components/responses/NotFound' }

