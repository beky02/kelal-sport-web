      responses:
        '200':
          description: Featured fixtures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
              example:
                items:
                  - $ref: '#/components/examples/EventArsenalChelsea/value'
                  - $ref: '#/components/examples/EventRealBarca/value'
                next_cursor: null

  /v1/events/{id}:
    get:
      tags: [Catalogue]
      operationId: getEvent
      security: [ {}, { playerAuth: [] }, { terminalAuth: [] } ]
      summary: Fixture with markets, by group
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: fx_arsenal_chelsea
        - name: groups
          in: query
