        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token, platform]
              properties:
                fcm_token: { type: string }
                platform: { type: string, enum: [android, ios, web] }
                app_version: { type: string }
            example: { fcm_token: "dGVzdC10b2tlbg...", platform: android, app_version: "1.0.3" }
      responses:
        '204': { description: Registered }

  # ---------------------------------------------------------------- Config (C16, C18)
  /v1/config/public:
    get:
      tags: [Config]
      operationId: getPublicConfig
      security: [ {}, { playerAuth: [] }, { terminalAuth: [] } ]
      summary: Branding, feature flags and the betting rule set for this tenant (host-resolved)
      parameters: [ { $ref: '#/components/parameters/AcceptLanguage' } ]
      responses:
        '200':
          description: Public configuration
          headers: { Cache-Control: { schema: { type: string, example: "public, max-age=60" } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicConfig' }
              example:
                tenant: { code: demo, name: Demo Bet }
                brand: { name: Demo Bet, logo_url: "https://cdn.example.et/demo/logo.svg", colors: { primary: "#0B6E4F", primary_contrast: "#FFFFFF", accent: "#F2A900", background: "#0F1419", surface: "#1A2027" }, support: { telegram: "https://t.me/demobet_support", phone: "+251900000000" } }
                languages: [am, en]
                default_language: am
                currency: ETB
                timezone: Africa/Addis_Ababa
                real_money_enabled: false
                features: { sports: true, virtuals: false, booking_codes: true, bonuses: true, retail: true, live: false }
                betting:
                  rules_version: 7
                  min_stake: "5.00"
                  max_stake: "50000.00"
                  max_payout: "1000000.00"
                  max_legs: 30
                  max_lines: 1024
                  acca_bonus_table: [ { min_legs: 3, pct: "3" }, { min_legs: 5, pct: "8" }, { min_legs: 8, pct: "15" }, { min_legs: 10, pct: "25" }, { min_legs: 15, pct: "50" }, { min_legs: 20, pct: "100" } ]
                  acca_bonus_min_leg_odds: "1.30"
                  acca_bonus_max: "200000.00"
                  taxes:
                    - { code: STAKE_TAX, base: stake, rate: "0.15", threshold: "0.00", deduct_from: stake }
                    - { code: WIN_TAX, base: gross_win, rate: "0.15", threshold: "1000.00", deduct_from: payout }
                  refund_stake_tax_on_void: false
                  rounding: down
                  default_odds_policy: higher
                  quick_stakes: ["20.00", "50.00", "100.00", "500.00"]
                retail_betting: { rules_version: 7, min_stake: "10.00", max_stake: "50000.00", max_payout: "1000000.00", max_legs: 30, max_lines: 1024, acca_bonus_table: [], acca_bonus_min_leg_odds: "1.30", acca_bonus_max: "0.00", taxes: [ { code: STAKE_TAX, base: stake, rate: "0.15", threshold: "0.00", deduct_from: stake }, { code: WIN_TAX, base: gross_win, rate: "0.15", threshold: "1000.00", deduct_from: payout } ], refund_stake_tax_on_void: false, rounding: down, default_odds_policy: higher }
                dictionary_version: 42
                min_app_version: "1.0.0"
                legal: { terms_version: "2026-10", rules_url: "https://example.et/rules", min_age: 21 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/app/version:
    get:
      tags: [Config]
      operationId: getAppVersion
      summary: Android app versions
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppVersion' }
              example: { min_supported: "1.0.0", latest: "1.0.3", download_url: "https://example.et/app/demobet-1.0.3.apk", sha256: "9f2c...e1", release_notes: "Faster match lists" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  # ---------------------------------------------------------------- Games (C17, Release 2)
  /v1/games:
    get:
      tags: [Games (R2)]
      operationId: listGames
      summary: Virtual games lobby (Release 2)
      responses:
        '200':
          description: Lobby
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Game' } }
              example:
                items:
                  - { id: "01J9A850000000000000000001", name: Virtual League, category: virtual_football, thumbnail_url: "https://cdn.example.et/games/vleague.webp", available: true }

  /v1/games/{id}/launch:
    post:
      tags: [Games (R2)]
      operationId: launchGame
      summary: Launch a game session (Release 2)
      security: [ { playerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lang, device]
              properties:
                lang: { $ref: '#/components/schemas/Language' }
                device: { type: string, enum: [mobile, desktop] }
            example: { lang: am, device: mobile }
      responses:
        '201':
          description: Session
          content:
            application/json:
              schema:
                type: object
                required: [url, session_id, expires_at]
                properties:
                  url: { type: string, format: uri }
                  session_id: { type: string }
                  expires_at: { $ref: '#/components/schemas/Timestamp' }
              example: { url: "https://games.provider.example/launch?token=abc", session_id: "01J9A860000000000000000001", expires_at: "2026-10-04T20:00:00Z" }
        '403': { $ref: '#/components/responses/Forbidden' }

