        - { name: tournament, in: query, schema: { type: string }, example: t_epl }
        - { name: date, in: query, description: "Local date (EAT); omit for all upcoming", schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [start_time, popularity], default: start_time } }
