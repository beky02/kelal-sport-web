  /v1/kyc/fayda/otp:
    post:
      tags:
      - KYC
      operationId: startFayda
      summary: Start Fayda (national ID) verification
      security:
      - playerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fayda_number
              properties:
                fayda_number:
                  type: string
                  minLength: 12
                  maxLength: 16
            example:
              fayda_number: FIN1234567890
      responses:
        '202':
          description: OTP sent by Fayda to the phone registered with the ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaydaChallenge'
              example:
                case_id: 01J9A7T0000000000000000001
                otp_sent_to: +2519••••567
                expires_in: 300
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
  /v1/kyc/fayda/verify:
    post:
      tags:
      - KYC
      operationId: verifyFayda
      summary: Complete Fayda verification with the OTP
      security:
      - playerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - case_id
              - otp
              properties:
                case_id:
                  type: string
                otp:
                  type: string
                  pattern: ^\d{6}$
            example:
              case_id: 01J9A7T0000000000000000001
              otp: '123456'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycResult'
              examples:
                verified:
                  value:
                    status: verified
                needs_info:
                  value:
                    status: needs_info
                    reason_code: NAME_MISMATCH
                pending:
                  value:
                    status: pending
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
  /v1/kyc/documents:
    post:
      tags:
