      operationId: uploadKycDocument
      summary: Upload an ID image for manual review
      security:
      - playerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - kind
              - file
              properties:
                case_id:
                  type: string
                  description: Omit to open a new manual case
                kind:
                  type: string
                  enum:
                  - id_front
                  - id_back
                  - selfie
                  - other
                file:
                  type: string
                  format: binary
                  description: JPEG/PNG/PDF, under 1 MB (client compresses)
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required:
                - document_id
                - case_id
                - case_status
                properties:
                  document_id:
                    type: string
                  case_id:
                    type: string
                  case_status:
                    $ref: '#/components/schemas/KycStatus'
              example:
                document_id: 01J9A7T1000000000000000001
                case_id: 01J9A7T0000000000000000002
                case_status: pending
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
