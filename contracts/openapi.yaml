      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BonusRule'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BonusRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/promo-codes/{code}:
    patch:
      tags:
      - Admin
      operationId: adminUpdatePromoCode
      security:
      - staffAuth: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCode'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
      summary: Admin update promo code
    delete:
      tags:
      - Admin
      operationId: adminDisablePromoCode
      summary: Disable a code (codes are never hard-deleted)
      security:
      - staffAuth: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Disabled
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/staff/{id}:
    patch:
      tags:
      - Admin
      operationId: adminUpdateStaff
      summary: Change roles or disable a staff user
      security:
      - staffAuth: []
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUser'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    playerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Player access token (15 min). The Next.js BFF holds it server-side; the Flutter app sends it directly.
    staffAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Back-office staff token (after password + TOTP). Audience `staff`; carries permission strings.
    terminalAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Shop terminal token (90 days, audience `terminal`). Every request is also signed with the device key (X-Device-Timestamp,
        X-Device-Signature).
    cashierAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cashier or shop-manager token (12 h, audience `retail_staff`), valid only from the POS device it logged
        in on.
    agentAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Agent portal token (15 min + refresh), audience `agent`.
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    TicketNoPath:
      name: ticket_no
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TicketNo'
      example: R7K2-M9XP-K
    ShopCodePath:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Z]{3}-\d{3}$
      example: ADM-004
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `next_cursor`
      schema:
        type: string
    From:
      name: from
      in: query
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      schema:
        type: string
        format: date
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        $ref: '#/components/schemas/Language'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated by the client per user action and reused on retry. Stored 24 h; same key + different body
        → 422 IDEMPOTENCY_MISMATCH.
      schema:
        type: string
        format: uuid
      example: 3f0c8b8e-6a3d-4c1e-9d0f-1b2a3c4d5e6f
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: Tenant code (e.g. `demo`). Sent by the Next.js server and non-browser clients; browsers are resolved by
        host. Must match the host's tenant when both are present, otherwise 400.
      schema:
        type: string
        pattern: ^[a-z0-9-]{2,32}$
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Client-generated request id, echoed back in the response and in problem.request_id
      schema:
        type: string
        maxLength: 64
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: ID of the activated terminal or POS device
      schema:
        type: string
    DeviceTimestamp:
      name: X-Device-Timestamp
      in: header
      required: true
      description: Unix milliseconds; rejected if more than 30 s from server time
      schema:
        type: integer
        format: int64
    DeviceSignature:
      name: X-Device-Signature
      in: header
      required: true
      description: Base64 ECDSA P-256 signature over `METHOD\nPATH\nTIMESTAMP\nSHA256(body)` with the non-extractable WebCrypto
        device key
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request (VALIDATION_FAILED) — `X-Tenant-Id` is not a tenant code or disagrees with the host,
        `X-Request-Id` is over 64 characters, or `Accept-Language` is not a supported language
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.et/errors/validation-failed
            title: X-Tenant-Id does not match host
            status: 400
            code: VALIDATION_FAILED
            request_id: req_01J9B00
    Unauthorized:
      description: Missing or invalid credentials (AUTH_INVALID_CREDENTIALS, AUTH_TOKEN_EXPIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.et/errors/invalid-credentials
            title: Wrong phone or password
            status: 401
            code: AUTH_INVALID_CREDENTIALS
            request_id: req_01J9B01
    Forbidden:
      description: Not allowed (KYC_REQUIRED, RG_SELF_EXCLUDED, RG_COOLING_OFF, RG_LIMIT_REACHED, RETAIL_DEVICE_NOT_ALLOWED,
        PERMISSION_DENIED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.et/errors/kyc-required
            title: Verify your identity first
            status: 403
            code: KYC_REQUIRED
            request_id: req_01J9B02
    NotFound:
      description: Not found (NOT_FOUND, BOOKING_NOT_FOUND, RETAIL_TICKET_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.et/errors/not-found
            title: Not found
            status: 404
            code: NOT_FOUND
            request_id: req_01J9B03
    Gone:
      description: Expired (BOOKING_EXPIRED, RETAIL_SLIP_CODE_EXPIRED, RETAIL_ACTIVATION_EXPIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.et/errors/booking-expired
            title: This code has expired
            status: 410
            code: BOOKING_EXPIRED
            request_id: req_01J9B04
    Conflict:
      description: State conflict (REG_PHONE_TAKEN, REG_ID_TAKEN, RETAIL_SHIFT_ALREADY_OPEN, PAY_WITHDRAWAL_NOT_CANCELLABLE,
        …)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.et/errors/phone-taken
            title: This phone is already registered
            status: 409
            code: REG_PHONE_TAKEN
            request_id: req_01J9B05
    Locked:
      description: Too many failed attempts (AUTH_LOCKED, RETAIL_PIN_LOCKED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.et/errors/locked
            title: Account temporarily locked
            status: 423
            code: AUTH_LOCKED
            detail: Try again in 15 minutes.
            request_id: req_01J9B06
    Unprocessable:
      description: Validation or business-rule failure; `errors[]` lists fields
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            stake_too_low:
              value:
                type: https://api.example.et/errors/stake-too-low
                title: Stake is below the minimum
                status: 422
                code: BET_STAKE_TOO_LOW
                detail: Minimum stake is 5.00 ETB.
                request_id: req_01J9B07
                errors:
                - field: stake
                  code: MIN
                  limit: '5.00'
            insufficient_funds:
              value:
                type: https://api.example.et/errors/insufficient-funds
                title: Balance too low
                status: 422
                code: WALLET_INSUFFICIENT_FUNDS
                request_id: req_01J9B08
            validation:
              value:
                type: https://api.example.et/errors/validation
                title: Some fields are invalid
                status: 422
                code: VALIDATION_FAILED
                request_id: req_01J9B09
                errors:
                - field: phone
                  code: FORMAT
                  message: Use +2519… or +2517…
    TooManyRequests:
      description: Rate limited (RATE_LIMITED, AUTH_OTP_RATE_LIMITED)
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.et/errors/rate-limited
            title: Too many requests
            status: 429
            code: RATE_LIMITED
            request_id: req_01J9B10
    BadGateway:
      description: Payment provider failed (PAY_PROVIDER_ERROR)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.et/errors/provider-error
            title: Payment provider did not respond
            status: 502
            code: PAY_PROVIDER_ERROR
            request_id: req_01J9B11
    PayloadTooLarge:
      description: Upload too large (VALIDATION_FAILED with errors[].code = MAX_SIZE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.et/errors/validation
            title: File is too large
            status: 413
            code: VALIDATION_FAILED
            request_id: req_01J9B13
            errors:
            - field: file
              code: MAX_SIZE
              limit: '1048576'
    Unavailable:
      description: Temporarily unavailable (REAL_MONEY_DISABLED, AUTH_OTP_UNAVAILABLE, KYC_PROVIDER_UNAVAILABLE, SERVICE_UNAVAILABLE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.et/errors/real-money-disabled
            title: Real-money play is not available yet
            status: 503
            code: REAL_MONEY_DISABLED
            request_id: req_01J9B12
  schemas:
    Money:
      type: string
      pattern: ^-?\d{1,12}\.\d{2}$
      description: Decimal string, 2 decimals, ETB unless a currency says otherwise
      examples:
      - '100.00'
    Odds:
      type: string
      pattern: ^\d{1,6}\.\d{2,3}$
      examples:
      - '1.85'
    Timestamp:
      type: string
      format: date-time
      examples:
      - '2026-10-03T14:05:22Z'
    Currency:
      type: string
      enum:
      - ETB
    Language:
      type: string
      enum:
      - am
      - en
    Phone:
      type: string
      pattern: ^\+251[79]\d{8}$
      examples:
      - '+251911234567'
    TicketNo:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]$
      description: Crockford base32 with a mod-32 check character; retail tickets start with R
      examples:
      - K7Q2-M9XP-M
    NextCursor:
      type:
      - string
      - 'null'
      description: Null on the last page
    Specifiers:
      type: object
      description: Market line parameters substituted into name templates, e.g. {"total":"2.5"}
      additionalProperties:
        type: string
    ErrorCode:
      type: string
      description: Stable machine code; clients switch on it. Registry in TD-01 §4.
      enum:
      - VALIDATION_FAILED
      - NOT_FOUND
      - RATE_LIMITED
      - PERMISSION_DENIED
      - SERVICE_UNAVAILABLE
      - IDEMPOTENCY_MISMATCH
      - REAL_MONEY_DISABLED
      - AUTH_INVALID_CREDENTIALS
      - AUTH_TOKEN_EXPIRED
      - AUTH_LOCKED
      - AUTH_OTP_INVALID
      - AUTH_OTP_EXPIRED
      - AUTH_OTP_RATE_LIMITED
      - AUTH_OTP_UNAVAILABLE
      - REG_PHONE_TAKEN
      - REG_ID_TAKEN
      - REG_UNDERAGE
      - KYC_REQUIRED
      - KYC_PROVIDER_UNAVAILABLE
      - WALLET_INSUFFICIENT_FUNDS
      - PAY_METHOD_UNAVAILABLE
      - PAY_AMOUNT_OUT_OF_RANGE
      - PAY_PROVIDER_ERROR
      - PAY_WITHDRAWAL_NOT_CANCELLABLE
      - PAY_ACTIVE_BONUS_WAGERING
      - BET_ODDS_CHANGED
      - BET_MARKET_SUSPENDED
      - BET_EVENT_STARTED
