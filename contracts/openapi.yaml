      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Aggregates
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentShopSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/retail/pos-devices/activate:
    post:
      tags:
      - Retail - cashier
      operationId: activatePosDevice
      summary: Activate a cashier PC once with its one-time code; later staff logins must come from this device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalActivateRequest'
            example:
              activation_code: P4ZQ8M2K
              device_public_key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...
              app_version: 1.0.0
      responses:
        '200':
          description: Activated; the POS stores the device id and keeps the private key in IndexedDB
          content:
            application/json:
              schema:
                type: object
                required:
                - device_id
                - shop
                properties:
                  device_id:
                    type: string
                  label:
                    type: string
                  shop:
                    type: object
                    required:
                    - code
                    - name
                    properties:
                      code:
                        type: string
                      name:
                        type: string
              example:
                device_id: 01J9A9C0000000000000000001
                label: Counter 1
                shop:
                  code: ADM-004
                  name: Adama Kebele 04
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
  /v1/retail/terminal/token:
    post:
      tags:
      - Retail - terminal
      operationId: rotateTerminalToken
      summary: Rotate the terminal token (the terminal calls this when fewer than 7 days remain)
      security:
      - terminalAuth: []
      responses:
        '200':
          description: New token; the old one stays valid for 5 minutes
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                - expires_in
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
              example:
                access_token: eyJhbGciOi...
                expires_in: 7776000
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/DeviceTimestamp'
      - $ref: '#/components/parameters/DeviceSignature'
  /v1/retail/staff/{id}/reset-pin:
    post:
      tags:
      - Retail - cashier
      operationId: managerResetPin
      summary: Shop manager resets a cashier PIN in the same shop (new PIN by SMS)
      security:
      - cashierAuth: []
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/DeviceTimestamp'
      - $ref: '#/components/parameters/DeviceSignature'
      responses:
        '204':
          description: Reset
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/agent/auth/refresh:
    post:
      tags:
      - Agent portal
      operationId: agentRefresh
      summary: Rotate agent tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
  /v1/agent/staff/{id}/reset-pin:
    post:
      tags:
      - Agent portal
      operationId: agentResetPin
      summary: Agent resets a cashier or manager PIN in one of its shops
      security:
      - agentAuth: []
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Reset
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/bets/{id}:
    get:
      tags:
      - Admin
      operationId: adminGetBet
      summary: Bet detail with settlement history
      security:
      - staffAuth: []
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Bet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bet'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/reconciliation/breaks:
    get:
      tags:
      - Admin
      operationId: adminListReconBreaks
      summary: Reconciliation breaks (finance:read)
      security:
      - staffAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - open
          - explained
          - resolved
          default: open
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Breaks
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - kind
                      - reference
                      - status
                      - created_at
                      properties:
                        id:
                          type: string
                        kind:
                          type: string
                          enum:
                          - internal
                          - provider
                          - regulator
                        provider:
                          type:
                          - string
                          - 'null'
                        reference:
                          type: string
                        expected:
                          oneOf:
                          - $ref: '#/components/schemas/Money'
                          - type: 'null'
                        actual:
                          oneOf:
                          - $ref: '#/components/schemas/Money'
                          - type: 'null'
                        status:
                          type: string
                          enum:
                          - open
                          - explained
                          - resolved
                        note:
                          type:
                          - string
                          - 'null'
                        created_at:
                          $ref: '#/components/schemas/Timestamp'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/cms/pages:
    get:
      tags:
      - Admin
      operationId: adminListPages
      security:
      - staffAuth: []
      responses:
